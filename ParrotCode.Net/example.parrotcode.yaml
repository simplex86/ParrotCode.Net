# ParrotCode.Net 配置示例。复制为 .parrotcode.yaml 后按需修改。
# .parrotcode.yaml 已被 .gitignore 忽略，不会被提交。
#
# DeepSeek 为主测试目标（OpenAI 兼容协议，迭代 3 起可真实联调）；
# OpenAI / Anthropic 保留兼容，需各自 key。

# 当前激活的 provider 名称（对应下方 providers 中某项的 name）。
# 省略时回退到 providers[0]。
active_provider: deepseek

providers:
  - name: deepseek
    protocol: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}

  - name: mock
    protocol: mock
    model: mock-1

  - name: openai
    protocol: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  - name: claude
    protocol: anthropic
    model: claude-3-5-sonnet-20241022
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}

# 迭代 6 新增：Agent ReAct 循环配置（全部可选，省略时用默认值）
agent:
  max_rounds: 10
  tool_choice: auto
  max_parallelism: 5
  tool_timeout_seconds: 30
  # system_prompt: "自定义 system prompt"

# 迭代 7a/7b 新增：TUI 渲染配置（全部可选，省略时用默认值）
tui:
  mode: live              # live | console（降级行模式）| terminal（Terminal.Gui v2，7c-1 新增）
  show_status_bar: true
  context_window_tokens: 64000   # 状态栏上下文占比分母
  enable_hitl: true       # 7b 新增：是否启用 HITL（人在回路），默认 true。false 时所有工具直接执行

# 迭代 8 接入真实拦截：黑名单（始终生效）+ 路径沙箱（按档位收紧）+ 策略（默认放行）
security:
  level: normal           # strict | normal | permissive（大小写不敏感；兼容旧拼法 permisive）
  # allow_paths:           # Strict 模式下额外的白名单根（项目根默认已白名单）
  #   - d:/projects/shared-libs
  #   - ../sibling-project
  # deny_paths:            # 显式拒绝的路径（所有非 Permissive 档位生效，最高优先级）
  #   - d:/secrets
  # extra_blacklist:       # 额外黑名单命令正则（与硬编码黑名单合并；YAML 中反斜杠需转义 \\b）
  #   - "\\bkubectl\\s+delete\\b"
  #   - "\\bdocker\\s+rm\\s+-f"
