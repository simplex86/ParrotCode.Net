# ParrotCode.Net 配置示例。复制为 .parrotcode.yaml 后按需修改。
# .parrotcode.yaml 已被 .gitignore 忽略，不会被提交。
#
# DeepSeek 为主测试目标（OpenAI 兼容协议，迭代 3 起可真实联调）；
# OpenAI / Anthropic 保留兼容，需各自 key。

# 当前激活的 provider 名称（对应下方 providers 中某项的 name）。
# 省略时回退到 providers[0]。
active_provider: deepseek

providers:
  - name: deepseek
    protocol: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}

  - name: mock
    protocol: mock
    model: mock-1

  - name: openai
    protocol: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  - name: claude
    protocol: anthropic
    model: claude-3-5-sonnet-20241022
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}

# 迭代 6 新增：Agent ReAct 循环配置（全部可选，省略时用默认值）
agent:
  max_rounds: 10
  tool_choice: auto
  max_parallelism: 5
  tool_timeout_seconds: 30
  # system_prompt: "自定义 system prompt"

# 迭代 7a/7b 新增：TUI 渲染配置（全部可选，省略时用默认值）
tui:
  mode: live              # live | console（降级行模式）| terminal（Terminal.Gui v2，7c-1 新增）
  show_status_bar: true
  context_window_tokens: 64000   # 状态栏上下文占比分母
  enable_hitl: true       # 7b 新增：是否启用 HITL（人在回路），默认 true。false 时所有工具直接执行

# 迭代 8 接入真实拦截：黑名单（始终生效）+ 路径沙箱（按档位收紧）+ 策略（默认放行）
security:
  level: normal           # strict | normal | permissive（大小写不敏感；兼容旧拼法 permisive）
  # allow_paths:           # Strict 模式下额外的白名单根（项目根默认已白名单）
  #   - d:/projects/shared-libs
  #   - ../sibling-project
  # deny_paths:            # 显式拒绝的路径（所有非 Permissive 档位生效，最高优先级）
  #   - d:/secrets
  # extra_blacklist:       # 额外黑名单命令正则（与硬编码黑名单合并；YAML 中反斜杠需转义 \\b）
  #   - "\\bkubectl\\s+delete\\b"
  #   - "\\bdocker\\s+rm\\s+-f"

# 迭代 9 新增：上下文管理配置（全部可选，省略时用默认值）
context:
  context_window_tokens: 64000    # 上下文窗口大小（省略时回退 tui.context_window_tokens）
  warning_fraction: 0.7           # token 占比超过此值发警告
  trigger_fraction: 0.9           # token 占比超过此值触发摘要
  per_result_threshold: 50000     # 单条工具结果截断阈值（字符数）
  round_total_threshold: 200000   # 一轮内工具结果合计截断阈值（字符数）
  preview_length: 2000            # 截断后保留预览长度（字符数）
  keep_recent_messages: 4         # 摘要时保留的最近消息数
  max_circuit_failures: 2         # 熔断器最大连续失败次数
  enable_auto_compress: true      # 是否启用自动压缩（false 时仅截断不摘要）

# 迭代 10b 新增：会话持久化配置（全部可选，省略时用默认值）
session:
  enable: true                    # 是否启用会话持久化（false 时 /session 命令不可用）
  # storage_dir: .parrotcode/sessions  # 会话存储目录（默认项目根下 .parrotcode/sessions）

# 迭代 10c 新增：项目指令配置（全部可选，省略时用默认值）
instructions:
  enable: true                        # 是否启用项目指令加载
  max_include_depth: 3                # @include 最大嵌套深度
  # project_instructions_path: ./PARROTCODE.md  # 自定义项目指令路径（默认 ./PARROTCODE.md）

# 迭代 11 新增：MCP 客户端配置
